<title>APEX</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --green: #39ff6e;
  --green-dim: rgba(57,255,110,0.12);
  --green-glow: rgba(57,255,110,0.25);
  --surface: #131920;
  --surface2: #1a2230;
  --surface3: #0d1219;
  --border: rgba(57,255,110,0.08);
  --border-h: rgba(57,255,110,0.25);
  --text: #e8eaed;
  --text2: rgba(232,234,237,0.65);
  --muted: rgba(232,234,237,0.35);
  --red: #ff4d4d;
  --yellow: #f59e0b;
  --blue: #4da6ff;
  --bg: #0a0f14;
  --sidebar-w: 260px;
  --header-h: 56px;
  --tabbar-h: 64px;
  --font: 'Chakra Petch', -apple-system, sans-serif;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--font); height:100%; overflow:hidden; }
#root { height:100%; }

/* ── LAYOUT ── */
.app-shell {
  display: flex; height: 100vh;
  padding-top: env(safe-area-inset-top);
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface3);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  z-index: 200;
}
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 199;
  backdrop-filter: blur(2px);
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  width: 36px; height: 36px; border-radius: 9px;
  object-fit: cover; border: 1px solid var(--border-h);
  box-shadow: 0 0 12px var(--green-glow);
}
.sidebar-brand-text { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
.sidebar-brand-text span { color: var(--green); }
.sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  cursor: pointer; transition: all 0.15s;
  font-size: 13px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.3px; border: 1px solid transparent;
  user-select: none;
}
.nav-item:hover { background: var(--green-dim); color: var(--text); }
.nav-item.active {
  background: var(--green-dim); color: var(--green);
  border-color: rgba(57,255,110,0.15);
}
.nav-item-icon {
  width: 32px; height: 32px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0;
  border: 1px solid rgba(57,255,110,0.1);
}
.nav-item-icon.emoji {
  background: var(--surface2); display: flex;
  align-items: center; justify-content: center;
  font-size: 15px; border: 1px solid var(--border);
}
.sidebar-footer {
  padding: 14px 18px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
}

/* ── MAIN CONTENT ── */
.main-area {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; min-width: 0;
}

/* ── HEADER ── */
.header {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: var(--surface3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.burger-btn {
  width: 34px; height: 34px; border-radius: 8px;
  background: none; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-direction: column; gap: 4px;
  padding: 8px; transition: border-color 0.15s;
}
.burger-btn:hover { border-color: var(--border-h); }
.burger-line {
  width: 16px; height: 1.5px; background: var(--text2);
  transition: all 0.2s; border-radius: 2px;
}
.burger-btn.open .burger-line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.burger-btn.open .burger-line:nth-child(2) { opacity: 0; }
.burger-btn.open .burger-line:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }
.header-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
.header-title span { color: var(--green); }
#header-clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 1px; }

/* ── PAGE CONTENT ── */
.page-content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--tabbar-h) + max(16px, env(safe-area-inset-bottom)) + 20px);
}
/* hide tabbar padding on desktop */
@media (min-width: 768px) {
  .page-content { padding-bottom: 24px; }
  .tab-bar { display: none !important; }
  .sidebar { transform: none !important; position: relative; }
  .sidebar-overlay { display: none !important; }
  .burger-btn { display: none; }
}
@media (max-width: 767px) {
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
}

/* ── IFRAME PANEL ── */
.iframe-panel { display: none; flex: 1; flex-direction: column; }
.iframe-panel.active { display: flex; }
.app-iframe {
  flex: 1; border: none; width: 100%; background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── TAB BAR (mobile) ── */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface3);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 8px 0 8px;
  z-index: 9999;
  -webkit-transform: translate3d(0,0,0);
  transform: translate3d(0,0,0);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  padding: 8px 4px; cursor: pointer;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.tab-icon {
  width: 28px; height: 28px; border-radius: 7px;
  object-fit: cover; transition: all 0.15s;
  opacity: 0.45; border: 1px solid transparent;
}
.tab-item.active .tab-icon {
  opacity: 1; border-color: rgba(57,255,110,0.3);
  box-shadow: 0 0 10px rgba(57,255,110,0.2);
}
.tab-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--muted); text-transform: uppercase;
}
.tab-item.active .tab-label { color: var(--green); }

/* ── DASHBOARD ── */
.dash { padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 24px; }
.dash-month {
  text-align: center;
  font-size: 22px; font-weight: 700; letter-spacing: 3px;
  color: var(--text); text-transform: uppercase;
}
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
}
.cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 500px) { .cards-row { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 14px;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color 0.15s;
}
.stat-card:hover { border-color: var(--border-h); }
.stat-card-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  color: var(--muted); text-transform: uppercase;
}
.stat-card-value {
  font-size: 22px; font-weight: 700; color: var(--text);
  font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
}
.stat-card-value.green { color: var(--green); }
.stat-card-value.red { color: var(--red); }

.platform-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.platform-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.platform-name {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  color: var(--muted); text-transform: uppercase;
}
.platform-value {
  font-size: 26px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
}

/* GOAL TRACKER */
.goal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.goal-card-header {
  display: flex; align-items: center; justify-content: space-between;
}
.goal-card-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.goal-pct {
  font-size: 20px; font-weight: 700; color: var(--green);
  font-variant-numeric: tabular-nums;
}
.goal-input-row { display: flex; align-items: center; gap: 10px; }
.goal-input-label { font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: 0.3px; }
.goal-input {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: var(--font);
  font-size: 14px; font-weight: 600; padding: 8px 12px;
  width: 140px; transition: border-color 0.15s;
  -moz-appearance: textfield;
}
.goal-input::-webkit-outer-spin-button,
.goal-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.goal-input:focus { outline: none; border-color: var(--border-h); }
.goal-fact { font-size: 12px; color: var(--muted); }
.goal-fact b { color: var(--text2); }
.progress-track {
  height: 8px; background: var(--surface2);
  border-radius: 99px; overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, #39ff6e, #00ffaa);
  box-shadow: 0 0 12px rgba(57,255,110,0.6), 0 0 24px rgba(57,255,110,0.3);
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 10px; height: 10px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(57,255,110,0.8);
}

/* TASKS PREVIEW */
.tasks-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 14px;
}
.tasks-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tasks-platform {
  display: flex; flex-direction: column; gap: 8px;
}
.tasks-platform-name { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.8px; }
.task-item-dash {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text2); line-height: 1.4;
}
.task-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  box-shadow: 0 0 6px var(--green);
}
.task-dot.done { background: var(--muted); box-shadow: none; }
.task-text-dash { flex: 1; }
.task-text-dash.done { text-decoration: line-through; color: var(--muted); }
.no-tasks { font-size: 12px; color: var(--muted); font-style: italic; }

/* save indicator */
.si {
  position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); right: 16px;
  background: var(--surface2); border: 1px solid rgba(57,255,110,0.25);
  border-radius: 20px; padding: 6px 12px;
  font-size: 11px; font-weight: 600; color: var(--green);
  opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 300;
}
.si.on { opacity: 1; }
</style>

// ── CLOCK ──
function useClock() {
  const [time, setTime] = useState('');
  useEffect(() => {
    const tick = () => {
      const n = new Date();
      setTime(String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));
    };
    tick(); const t = setInterval(tick, 10000); return () => clearInterval(t);
  }, []);
  return time;
}

// ── SWIPE TO OPEN SIDEBAR ──
function useSwipe(onSwipeRight, onSwipeLeft) {
  const startX = useRef(null);
  const onTouchStart = (e) => { startX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (dx > 60 && startX.current < 40) onSwipeRight();
    if (dx < -60) onSwipeLeft();
    startX.current = null;
  };
  return { onTouchStart, onTouchEnd };
}

const MONTHS = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
function monthKey(offset=0) {
  const d = new Date(); d.setMonth(d.getMonth()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

  const [reportData, setReportData] = useState(null);
  const [plannerData, setPlannerData] = useState(null);
  const [goal, setGoal] = useState(() => parseFloat(localStorage.getItem('apex_goal') || '10000'));
  const curMonth = monthKey(0);
  const monthLabel = MONTHS[new Date().getMonth()];

  useEffect(() => {
    // Load report — collection: reports, doc: e.g. 2026-05
    getDoc(doc(db, 'reports', curMonth)).then(snap => {
      if (snap.exists()) setReportData(snap.data());
    }).catch(()=>{});
    // Load planner — collection: planner, doc: planner-data
    getDoc(doc(db, 'planner', 'planner-data')).then(snap => {
      if (snap.exists()) setPlannerData(snap.data());
    }).catch(()=>{});
  }, []);

  const saveGoal = (v) => {
    setGoal(v);
    localStorage.setItem('apex_goal', String(v));
  };

  // Structure: fb.spend_a={d0:"152",...}, fb.rev_a={d0:"144",...}, same for tt
  let totalSpend = 0, fbProfit = 0, ttProfit = 0;
  if (reportData) {
    const nv = v => parseFloat(v)||0;
    const sumObj = obj => obj ? Object.values(obj).reduce((s,v)=>s+nv(v),0) : 0;
    const fbSpend = sumObj(reportData.fb?.spend_a);
    const ttSpend = sumObj(reportData.tt?.spend_a);
    // Revenue = rev_a (aggregated) + rev (per-offer r0d0, r1d0...)
    const fbRevA   = sumObj(reportData.fb?.rev_a);
    const ttRevA   = sumObj(reportData.tt?.rev_a);
    const fbRevOff = sumObj(reportData.fb?.rev);
    const ttRevOff = sumObj(reportData.tt?.rev);
    const fbRev = fbRevA + fbRevOff;
    const ttRev = ttRevA + ttRevOff;
    totalSpend = fbSpend + ttSpend;
    // Match Report formula: net = rev - spend*1.03
    const cost = totalSpend * 1.03;
    fbProfit = fbRev - fbSpend * 1.03;
    ttProfit = ttRev - ttSpend * 1.03;
  }

  const totalProfit = fbProfit + ttProfit;
  const cost3 = totalSpend * 1.03; const roi = cost3 > 0 ? (totalProfit / cost3 * 100) : 0;
  const goalPct = goal > 0 ? Math.min(100, (totalProfit / goal) * 100) : 0;

  const fmt = (v) => {
    const n = Math.round(v);
    return (n >= 0 ? '+' : '') + '$' + Math.abs(n).toLocaleString();
  };
  const fmtSpend = (v) => '$' + Math.round(v).toLocaleString();

  // Planner tasks — structure: fb.tasks[], tt.tasks[]
  const fbTasks = plannerData?.fb?.tasks || [];
  const ttTasks = plannerData?.tt?.tasks || [];

  return (
    React.createElement('div', { className: 'dash' },
      React.createElement('div', { className: 'dash-month' }, monthLabel),

      // Summary cards
      React.createElement('div', null,
        React.createElement('div', { className: 'section-label' }, 'Сводка за месяц'),
        React.createElement('div', { className: 'cards-row' },
          React.createElement('div', { className: 'stat-card' },
            React.createElement('div', { className: 'stat-card-label' }, 'Total Spend'),
            React.createElement('div', { className: 'stat-card-value' }, fmtSpend(totalSpend))
          ),
          React.createElement('div', { className: 'stat-card' },
            React.createElement('div', { className: 'stat-card-label' }, 'Net Profit'),
            React.createElement('div', { className: `stat-card-value ${totalProfit >= 0 ? 'green' : 'red'}` }, fmt(totalProfit))
          ),
          React.createElement('div', { className: 'stat-card' },
            React.createElement('div', { className: 'stat-card-label' }, 'ROI'),
            React.createElement('div', { className: `stat-card-value ${roi >= 0 ? 'green' : 'red'}` }, Math.round(roi)+'%')
          )
        )
      ),

      // Platform breakdown
      React.createElement('div', null,
        React.createElement('div', { className: 'section-label' }, 'Профит по платформам'),
        React.createElement('div', { className: 'platform-row' },
          React.createElement('div', { className: 'platform-card' },
            React.createElement('div', { className: 'platform-name' }, 'Нутра FB'),
            React.createElement('div', { className: `platform-value ${fbProfit >= 0 ? 'green' : 'red'}` }, fmt(fbProfit))
          ),
          React.createElement('div', { className: 'platform-card' },
            React.createElement('div', { className: 'platform-name' }, 'Нутра TT'),
            React.createElement('div', { className: `platform-value ${ttProfit >= 0 ? 'green' : 'red'}` }, fmt(ttProfit))
          )
        )
      ),

      // Goal tracker
      React.createElement('div', null,
        React.createElement('div', { className: 'section-label' }, 'Цель месяца'),
        React.createElement('div', { className: 'goal-card' },
          React.createElement('div', { className: 'goal-card-header' },
            React.createElement('div', { className: 'goal-card-title' }, 'Goal Tracker — Профит / Месяц'),
            React.createElement('div', { className: 'goal-pct' }, Math.round(goalPct)+'%')
          ),
          React.createElement('div', { className: 'goal-input-row' },
            React.createElement('span', { className: 'goal-input-label' }, 'Цель ($)'),
            React.createElement('input', {
              type: 'number', className: 'goal-input',
              value: goal,
              onChange: e => saveGoal(parseFloat(e.target.value)||0)
            })
          ),
          React.createElement('div', { className: 'goal-fact' },
            'Факт: ', React.createElement('b', null, fmt(totalProfit)),
            ' / $'+Math.round(goal).toLocaleString()
          ),
          React.createElement('div', { className: 'progress-track' },
            React.createElement('div', {
              className: 'progress-fill',
              style: { width: goalPct+'%' }
            })
          )
        )
      ),

      // Planner tasks preview
      React.createElement('div', null,
        React.createElement('div', { className: 'section-label' }, 'Задачи сегодня'),
        React.createElement('div', { className: 'tasks-preview' },
          React.createElement('div', { className: 'tasks-row' },
            React.createElement('div', { className: 'tasks-platform' },
              React.createElement('div', { className: 'tasks-platform-name' }, 'Facebook'),
              fbTasks.length === 0
                ? React.createElement('div', { className: 'no-tasks' }, 'Нет задач')
                : fbTasks.slice(0,4).map((t,i) =>
                    React.createElement('div', { key:i, className: 'task-item-dash' },
                      React.createElement('div', { className: `task-dot ${t.done?'done':''}` }),
                      React.createElement('span', { className: `task-text-dash ${t.done?'done':''}` }, t.text)
                    )
                  )
            ),
            React.createElement('div', { className: 'tasks-platform' },
              React.createElement('div', { className: 'tasks-platform-name' }, 'TikTok'),
              ttTasks.length === 0
                ? React.createElement('div', { className: 'no-tasks' }, 'Нет задач')
                : ttTasks.slice(0,4).map((t,i) =>
                    React.createElement('div', { key:i, className: 'task-item-dash' },
                      React.createElement('div', { className: `task-dot ${t.done?'done':''}` }),
                      React.createElement('span', { className: `task-text-dash ${t.done?'done':''}` }, t.text)
                    )
                  )
            )
          )
        )
      )
    )
  );
}

// ── APP IFRAME PANEL ──
const iframeCache = {};
function AppPanel({ tab, active }) {
  const ref = useRef(null);
  useEffect(() => {
    if (active && ref.current && !iframeCache[tab.id]) {
      ref.current.src = tab.url;
      iframeCache[tab.id] = true;
    }
  }, [active]);
  return React.createElement('div', {
    className: `iframe-panel ${active ? 'active' : ''}`,
    style: { flex: 1 }
  },
    React.createElement('iframe', {
      ref, className: 'app-iframe',
      style: { height: '100%', display: 'block' },
      src: ''
    })
  );
}

// ── MAIN APP ──
function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const clock = useClock();
  const swipe = useSwipe(() => setSidebarOpen(true), () => setSidebarOpen(false));

  const activeTabData = TABS.find(t => t.id === activeTab);

  const switchTab = (id) => {
    setActiveTab(id);
    setSidebarOpen(false);
  };

  return React.createElement('div', { className: 'app-shell', ...swipe },

    // Sidebar overlay
    React.createElement('div', {
      className: `sidebar-overlay ${sidebarOpen ? 'open' : ''}`,
      onClick: () => setSidebarOpen(false)
    }),

    // Sidebar
    React.createElement('div', { className: `sidebar ${sidebarOpen ? 'open' : ''}` },
      React.createElement('div', { className: 'sidebar-brand' },
        React.createElement('img', { className: 'sidebar-logo', src: LOGOS.main, alt: 'APEX' }),
        React.createElement('span', { className: 'sidebar-brand-text' },
          React.createElement('span', null, 'APEX')
        )
      ),
      React.createElement('nav', { className: 'sidebar-nav' },
        TABS.map(tab =>
          React.createElement('div', {
            key: tab.id,
            className: `nav-item ${activeTab === tab.id ? 'active' : ''}`,
            onClick: () => switchTab(tab.id)
          },
            tab.logo_data
              ? React.createElement('img', { className: 'nav-item-icon', src: tab.logo_data, alt: tab.label })
              : React.createElement('img', { className: 'nav-item-icon', src: LOGOS[tab.logo], alt: tab.label }),
            tab.label
          )
        )
      ),
      React.createElement('div', { className: 'sidebar-footer' }, 'APEX © 2025')
    ),

    // Main area
    React.createElement('div', { className: 'main-area' },

      // Header
      React.createElement('div', { className: 'header' },
        React.createElement('div', { className: 'header-left' },
          React.createElement('button', {
            className: `burger-btn ${sidebarOpen ? 'open' : ''}`,
            onClick: () => setSidebarOpen(o => !o)
          },
            React.createElement('div', { className: 'burger-line' }),
            React.createElement('div', { className: 'burger-line' }),
            React.createElement('div', { className: 'burger-line' })
          ),
          React.createElement('div', { className: 'header-title' },
            React.createElement('span', null, 'APEX '),
            activeTabData?.label || 'Dashboard'
          )
        ),
        React.createElement('div', { id: 'header-clock' }, clock)
      ),

      // Content
      React.createElement('div', { className: 'page-content', style: { display: activeTab === 'dashboard' ? 'block' : 'none' } },
        React.createElement(Dashboard)
      ),

      // App iframes
      TABS.filter(t => t.url).map(tab =>
        React.createElement(AppPanel, {
          key: tab.id, tab,
          active: activeTab === tab.id
        })
      )
    ),

    // Tab bar (mobile)
    React.createElement('div', { className: 'tab-bar' },
      TABS.map(tab =>
        React.createElement('div', {
          key: tab.id,
          className: `tab-item ${activeTab === tab.id ? 'active' : ''}`,
          onClick: () => switchTab(tab.id)
        },
          tab.logo_data
            ? React.createElement('img', { className: 'tab-icon', src: tab.logo_data, alt: tab.label })
            : React.createElement('img', { className: 'tab-icon', src: LOGOS[tab.logo], alt: tab.label }),
          React.createElement('span', { className: 'tab-label' }, tab.label)
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
