<style>
  :root {
    --green: #39ff6e;
    --surface: #131920;
    --surface2: #1a2230;
    --surface3: #0d1219;
    --border: rgba(57,255,110,0.1);
    --border-hover: rgba(57,255,110,0.28);
    --text: #e8eaed;
    --text-muted: rgba(232,234,237,0.38);
    --red: #ff4d4d;
    --yellow: #f59e0b;
    --bg: #0a0f14;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top));
    background: var(--surface3);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-img {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    display: block;
    object-fit: cover;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .header-title span {
    color: var(--green);
  }

  #clock {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 0;
    padding: 12px 20px 0;
    background: var(--surface3);
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 8px 24px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    font-family: -apple-system, sans-serif;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tab-btn.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  /* ── MAIN ── */
  main {
    padding: 16px 0 40px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── TABLE WRAPPER ── */
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px;
  }

  table {
    border-collapse: collapse;
    min-width: 1100px;
    width: 100%;
  }

  thead th {
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface3);
    position: sticky;
    top: 0;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }

  tbody tr:hover {
    background: rgba(57,255,110,0.03);
  }

  tbody td {
    padding: 14px 8px;
    vertical-align: middle;
  }

  td.num {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    width: 32px;
    min-width: 32px;
  }

  /* ── INPUTS ── */
  .cell-input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text);
    font-family: -apple-system, sans-serif;
    font-size: 15px;
    padding: 6px 7px;
    width: 100%;
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }

  .cell-input::-webkit-outer-spin-button,
  .cell-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .cell-input:hover {
    border-color: var(--border);
    background: var(--surface);
  }

  .cell-input:focus {
    outline: none;
    border-color: var(--border-hover);
    background: var(--surface);
  }

  .cell-input::placeholder { color: var(--text-muted); }

  /* Column widths */
  .col-offer { min-width: 160px; }
  .col-vert  { min-width: 90px; }
  .col-geo   { min-width: 130px; }
  .col-capa  { min-width: 50px; }
  .col-cond  { min-width: 160px; }
  .col-pay   { min-width: 50px; }
  .col-be    { min-width: 50px; }
  .col-prokl { min-width: 100px; }
  .col-creo  { min-width: 60px; }
  .col-launch{ min-width: 130px; }
  .col-status{ min-width: 110px; }
  .col-del   { min-width: 36px; }

  /* ── OFFER CELL (name + link) ── */
  .offer-cell {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .link-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .link-btn:hover {
    border-color: var(--border-hover);
    background: var(--surface2);
  }

  .link-btn svg { pointer-events: none; }

  .link-btn.has-url { border-color: var(--green); }
  .link-btn.has-url svg path { stroke: var(--green); }

  .url-popup {
    display: none;
    position: absolute;
    top: 50%;
    left: calc(100% + 8px);
    transform: translateY(-50%);
    z-index: 50;
    background: var(--surface2);
    border: 1px solid var(--border-hover);
    border-radius: 7px;
    padding: 8px;
    min-width: 260px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  .url-popup.open { display: block; }

  .url-popup input {
    width: 244px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px;
    font-family: -apple-system, sans-serif;
  }

  .url-popup input:focus {
    outline: none;
    border-color: var(--border-hover);
  }

  .url-popup-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .url-popup-actions button {
    flex: 1;
    padding: 5px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
  }

  .btn-save-url {
    background: var(--green);
    color: #000;
  }

  .btn-open-url {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border) !important;
  }

  /* ── CHECKBOXES ── */
  .cb-group {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }

  .cb-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .cb-label span {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .cb-label input[type=checkbox] {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1px solid var(--border-hover);
    background: var(--surface);
    cursor: pointer;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }

  .cb-label input[type=checkbox]:checked {
    background: var(--green);
    border-color: var(--green);
  }

  .cb-label input[type=checkbox]:checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: 2px solid #000;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  /* ── LAUNCH BADGE ── */
  .launch-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  .launch-badge.prep {
    background: rgba(232,234,237,0.06);
    color: var(--text-muted);
  }

  .launch-badge.ready {
    background: rgba(57,255,110,0.12);
    color: var(--green);
    box-shadow: 0 0 8px rgba(57,255,110,0.15);
  }

  /* ── STATUS DROPDOWN ── */
  .status-select {
    -webkit-appearance: none;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    width: 100%;
    transition: border-color 0.15s;
  }

  .status-select:focus { outline: none; border-color: var(--border-hover); }

  .status-select.activ  { color: var(--green); border-color: rgba(57,255,110,0.3); }
  .status-select.stop   { color: var(--red);   border-color: rgba(255,77,77,0.3); }
  .status-select.relaunch { color: var(--yellow); border-color: rgba(245,158,11,0.3); }
  .status-select.none   { color: var(--text-muted); }

  /* ── DELETE BTN ── */
  .del-btn {
    width: 26px;
    height: 26px;
    border-radius: 5px;
    background: none;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  .del-btn:hover {
    color: var(--red);
    border-color: rgba(255,77,77,0.3);
    background: rgba(255,77,77,0.06);
  }

  /* ── ADD BTN ── */
  .add-row-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 12px 16px 0;
    padding: 9px 16px;
    background: none;
    border: 1px dashed rgba(57,255,110,0.25);
    border-radius: 7px;
    color: var(--green);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    width: calc(100% - 32px);
    justify-content: center;
  }

  .add-row-btn:hover {
    background: rgba(57,255,110,0.04);
    border-color: rgba(57,255,110,0.5);
  }

  /* ── PAYOUT CELL ── */
  .pay-wrap {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .pay-wrap .sym {
    color: var(--green);
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* ── CALCULATOR ── */
  .calc-wrap {
    margin: 20px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .calc-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .calc-fields {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .calc-field {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .calc-field label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .calc-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    width: 90px;
    -moz-appearance: textfield;
    transition: border-color 0.15s;
  }

  .calc-input::-webkit-outer-spin-button,
  .calc-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .calc-input:focus {
    outline: none;
    border-color: var(--border-hover);
  }

  .calc-eq {
    font-size: 13px;
    color: var(--text-muted);
  }

  .calc-result {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .calc-result label {
    font-size: 12px;
    color: var(--text-muted);
  }

  .calc-result-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--green);
    min-width: 60px;
    font-variant-numeric: tabular-nums;
  }

  /* ── SAVE INDICATOR ── */
  #save-indicator {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    right: 16px;
    background: var(--surface2);
    border: 1px solid rgba(57,255,110,0.2);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--green);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
  }

  #save-indicator.show { opacity: 1; }
</style>
</head>

  return geoMap[key] || null;
}

function applyGeoFlag(input, row) {
  const val = input.value;
  const flag = getFlag(val);
  if (flag && !val.startsWith(flag)) {
    const clean = val.replace(/^\p{Emoji_Presentation}\s*/u, '');
    if (flag + ' ' + clean !== val) {
      input.value = flag + ' ' + clean;
      row.geo = input.value;
    }
  } else {
    row.geo = val;
  }
}

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

// ── TABS ──
window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && tab==='fb') || (i===1 && tab==='tt'));
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
};

// ── SAVE INDICATOR ──
function showSaved() {
  const el = document.getElementById('save-indicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── FIREBASE LOAD ──
async function loadData(tab) {
  try {
    const snap = await getDoc(doc(db, 'offers', tab));
    if (snap.exists()) {
      state[tab] = snap.data().rows || [];
    } else {
      state[tab] = [];
    }
  } catch(e) {
    console.warn('Load error', e);
    state[tab] = [];
  }
  renderTable(tab);
}

// ── FIREBASE SAVE ──
async function saveData(tab) {
  try {
    await setDoc(doc(db, 'offers', tab), { rows: state[tab] });
    showSaved();
  } catch(e) {
    console.warn('Save error', e);
  }
}

function scheduleSave(tab) {
  if (saveTimers[tab]) clearTimeout(saveTimers[tab]);
  saveTimers[tab] = setTimeout(() => saveData(tab), 800);
}

// ── RENDER ──
function renderTable(tab) {
  const tbody = document.getElementById('tbody-' + tab);
  tbody.innerHTML = '';
  state[tab].forEach((row, idx) => {
    tbody.appendChild(createRow(tab, row, idx));
  });
}

function createRow(tab, row, idx) {
  const tr = document.createElement('tr');

  // 1. №
  const tdNum = document.createElement('td');
  tdNum.className = 'num';
  tdNum.textContent = idx + 1;
  tr.appendChild(tdNum);

  // 2. Оффер + link
  const tdOffer = document.createElement('td');
  tdOffer.className = 'col-offer';
  const offerCell = document.createElement('div');
  offerCell.className = 'offer-cell';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'cell-input';
  nameInput.placeholder = 'Название';
  nameInput.value = row.name || '';
  nameInput.addEventListener('input', () => { row.name = nameInput.value; scheduleSave(tab); });

  const linkBtn = document.createElement('button');
  linkBtn.className = 'link-btn' + (row.url ? ' has-url' : '');
  linkBtn.title = 'Ссылка';
  linkBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none">
    <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
  </svg>`;

  const popup = document.createElement('div');
  popup.className = 'url-popup';

  const urlInput = document.createElement('input');
  urlInput.type = 'url';
  urlInput.placeholder = 'https://...';
  urlInput.value = row.url || '';
  urlInput.addEventListener('click', e => e.stopPropagation());

  const actions = document.createElement('div');
  actions.className = 'url-popup-actions';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn-save-url';
  saveBtn.textContent = 'Сохранить';
  saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    row.url = urlInput.value.trim();
    linkBtn.classList.toggle('has-url', !!row.url);
    const paths = linkBtn.querySelectorAll('path');
    paths.forEach(p => p.setAttribute('stroke', row.url ? 'var(--green)' : '#e8eaed'));
    popup.classList.remove('open');
    scheduleSave(tab);
  });

  const openBtn = document.createElement('button');
  openBtn.className = 'btn-open-url';
  openBtn.textContent = 'Открыть';
  openBtn.style.border = '1px solid var(--border)';
  openBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const u = row.url || urlInput.value.trim();
    if (u) window.open(u, '_blank');
  });

  actions.appendChild(saveBtn);
  actions.appendChild(openBtn);
  popup.appendChild(urlInput);
  popup.appendChild(actions);

  linkBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (popup.classList.contains('open') && row.url) {
      window.open(row.url, '_blank');
      popup.classList.remove('open');
    } else {
      document.querySelectorAll('.url-popup.open').forEach(p => p.classList.remove('open'));
      popup.classList.toggle('open');
    }
  });

  document.addEventListener('click', () => popup.classList.remove('open'), { once: false });

  const linkWrap = document.createElement('div');
  linkWrap.style.position = 'relative';
  linkWrap.appendChild(linkBtn);
  linkWrap.appendChild(popup);

  offerCell.appendChild(nameInput);
  offerCell.appendChild(linkWrap);
  tdOffer.appendChild(offerCell);
  tr.appendChild(tdOffer);

  // 3. Вертикаль
  tr.appendChild(makeTextCell(tab, row, 'vertical', 'Вертикаль', 'col-vert'));

  // 4. ГЕО (with flag)
  const tdGeo = document.createElement('td');
  tdGeo.className = 'col-geo';
  const geoInput = document.createElement('input');
  geoInput.type = 'text';
  geoInput.className = 'cell-input';
  geoInput.placeholder = 'Страна';
  geoInput.value = row.geo || '';
  geoInput.addEventListener('input', () => applyGeoFlag(geoInput, row));
  geoInput.addEventListener('input', () => scheduleSave(tab));
  tdGeo.appendChild(geoInput);
  tr.appendChild(tdGeo);

  // 5. Капа
  tr.appendChild(makeNumCell(tab, row, 'capa', '∞', 'col-capa'));

  // 6. Условия
  tr.appendChild(makeTextCell(tab, row, 'conditions', 'CPA/CPL...', 'col-cond'));

  // 7. Выплата $
  const tdPay = document.createElement('td');
  tdPay.className = 'col-pay';
  const payWrap = document.createElement('div');
  payWrap.className = 'pay-wrap';
  const paySym = document.createElement('span');
  paySym.className = 'sym';
  paySym.textContent = '$';
  const payInput = document.createElement('input');
  payInput.type = 'number';
  payInput.className = 'cell-input';
  payInput.placeholder = '0';
  payInput.value = row.payout || '';
  payInput.addEventListener('input', () => { row.payout = payInput.value; scheduleSave(tab); });
  payWrap.appendChild(paySym);
  payWrap.appendChild(payInput);
  tdPay.appendChild(payWrap);
  tr.appendChild(tdPay);

  // 8. Брейк-ивен $
  const tdBE = document.createElement('td');
  tdBE.className = 'col-be';
  const beWrap = document.createElement('div');
  beWrap.className = 'pay-wrap';
  const beSym = document.createElement('span');
  beSym.className = 'sym';
  beSym.textContent = '$';
  const beInput = document.createElement('input');
  beInput.type = 'number';
  beInput.className = 'cell-input';
  beInput.placeholder = '0';
  beInput.value = row.breakeven || '';
  beInput.addEventListener('input', () => { row.breakeven = beInput.value; scheduleSave(tab); });
  beWrap.appendChild(beSym);
  beWrap.appendChild(beInput);
  tdBE.appendChild(beWrap);
  tr.appendChild(tdBE);

  // 9. Проклы (Задача + Готово)
  const tdProkl = document.createElement('td');
  tdProkl.className = 'col-prokl';
  const cbGroup = document.createElement('div');
  cbGroup.className = 'cb-group';

  const cbTask = makeCB('Задача', row.prokl_task, (v) => {
    row.prokl_task = v;
    updateLaunch(tr, row);
    scheduleSave(tab);
  });
  const cbDone = makeCB('Готово', row.prokl_done, (v) => {
    row.prokl_done = v;
    updateLaunch(tr, row);
    scheduleSave(tab);
  });

  cbGroup.appendChild(cbTask);
  cbGroup.appendChild(cbDone);
  tdProkl.appendChild(cbGroup);
  tr.appendChild(tdProkl);

  // 10. Крео
  const tdCreo = document.createElement('td');
  tdCreo.className = 'col-creo';
  const creoGroup = document.createElement('div');
  creoGroup.className = 'cb-group';
  const cbCreo = makeCB('Крео', row.creo, (v) => {
    row.creo = v;
    updateLaunch(tr, row);
    scheduleSave(tab);
  });
  creoGroup.appendChild(cbCreo);
  tdCreo.appendChild(creoGroup);
  tr.appendChild(tdCreo);

  // 11. Запуск
  const tdLaunch = document.createElement('td');
  tdLaunch.className = 'col-launch';
  const badge = document.createElement('span');
  badge.className = 'launch-badge';
  updateBadge(badge, row);
  tdLaunch.appendChild(badge);
  tr.appendChild(tdLaunch);
  tr._launchBadge = badge;

  // 12. Статус
  const tdStatus = document.createElement('td');
  tdStatus.className = 'col-status';
  const sel = document.createElement('select');
  sel.className = 'status-select';
  const opts = [['—','none'], ['Актив','activ'], ['Стоп','stop'], ['Перезапуск','relaunch']];
  opts.forEach(([label, val]) => {
    const o = document.createElement('option');
    o.value = val;
    o.textContent = label;
    if (row.status === val) o.selected = true;
    sel.appendChild(o);
  });
  if (!row.status) sel.value = 'none';
  sel.className = 'status-select ' + (row.status || 'none');
  sel.addEventListener('change', () => {
    row.status = sel.value;
    sel.className = 'status-select ' + sel.value;
    scheduleSave(tab);
  });
  tdStatus.appendChild(sel);
  tr.appendChild(tdStatus);

  // 13. Удалить
  const tdDel = document.createElement('td');
  tdDel.className = 'col-del';
  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.textContent = '×';
  delBtn.addEventListener('click', () => {
    if (confirm('Удалить оффер?')) {
      const i = state[tab].indexOf(row);
      if (i !== -1) state[tab].splice(i, 1);
      renderTable(tab);
      scheduleSave(tab);
    }
  });
  tdDel.appendChild(delBtn);
  tr.appendChild(tdDel);

  return tr;
}

function makeTextCell(tab, row, key, ph, cls) {
  const td = document.createElement('td');
  td.className = cls;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'cell-input';
  inp.placeholder = ph;
  inp.value = row[key] || '';
  inp.addEventListener('input', () => { row[key] = inp.value; scheduleSave(tab); });
  td.appendChild(inp);
  return td;
}

function makeNumCell(tab, row, key, ph, cls) {
  const td = document.createElement('td');
  td.className = cls;
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.className = 'cell-input';
  inp.placeholder = ph;
  inp.value = row[key] || '';
  inp.addEventListener('input', () => { row[key] = inp.value; scheduleSave(tab); });
  td.appendChild(inp);
  return td;
}

function makeCB(label, checked, onChange) {
  const lbl = document.createElement('label');
  lbl.className = 'cb-label';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!checked;
  cb.addEventListener('change', () => onChange(cb.checked));
  const sp = document.createElement('span');
  sp.textContent = label;
  lbl.appendChild(cb);
  lbl.appendChild(sp);
  return lbl;
}

function updateLaunch(tr, row) {
  updateBadge(tr._launchBadge, row);
}

function updateBadge(badge, row) {
  const ready = row.prokl_task && row.prokl_done && row.creo;
  badge.className = 'launch-badge ' + (ready ? 'ready' : 'prep');
  badge.textContent = ready ? '🚀 Готово к запуску' : '⏳ Подготовка';
}

// ── ADD ROW ──
window.addRow = function(tab) {
  state[tab].push({
    id: Date.now(),
    name: '', url: '', vertical: '', geo: '',
    capa: '', conditions: '', payout: '', breakeven: '',
    prokl_task: false, prokl_done: false, creo: false,
    status: 'none'
  });
  renderTable(tab);
  scheduleSave(tab);
  // focus last name input
  const inputs = document.querySelectorAll('#tbody-' + tab + ' tr:last-child input[type=text]');
  if (inputs[0]) inputs[0].focus();
};

// ── CALCULATOR ──
window.calcBE = function(tab) {
  const pay = parseFloat(document.getElementById('calc-pay-' + tab).value) || 0;
  const apr = parseFloat(document.getElementById('calc-apr-' + tab).value) || 0;
  const res = document.getElementById('calc-res-' + tab);
  if (pay > 0 && apr > 0) {
    const val = (pay * apr / 100).toFixed(2);
    res.textContent = '$' + val;
  } else {
    res.textContent = '—';
  }
};

// ── INIT ──
await loadData('fb');
await loadData('tt');

</script>
