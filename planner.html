<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e8eaed;font-family:sans-serif;min-height:100vh}
:root{--green:#39ff6e;--surface:#131920;--border:rgba(57,255,110,0.12);--border-hover:rgba(57,255,110,0.3);--text-muted:rgba(232,234,237,0.45)}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px 18px;border-bottom:1px solid var(--border)}
.logo-area{display:flex;align-items:center;gap:13px}
.logo-wrap{width:42px;height:42px;border-radius:11px;overflow:hidden;border:1px solid var(--border-hover);flex-shrink:0;background:#0d1117}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-size:17px;font-weight:500;letter-spacing:0.04em;color:#fff}
.brand span{color:var(--green);font-weight:600}
.clock-block{text-align:right}
.clock-time{font-size:28px;font-weight:500;color:#fff;letter-spacing:0.02em;line-height:1}
.clock-date{font-size:12px;color:var(--text-muted);margin-top:4px;letter-spacing:0.05em}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:26px 32px 32px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:border-color 0.2s}
.col:hover{border-color:var(--border-hover)}
.col-header{padding:18px 20px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.col-label{display:flex;align-items:center;gap:11px}
.platform-badge{font-size:15px;font-weight:600;letter-spacing:0.06em;color:#fff}
.platform-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb-icon{background:linear-gradient(135deg,#1877f2,#0c5fd4)}
.tt-icon{background:#111;border:1px solid #333}
.progress-ring-wrap{display:flex;align-items:center;gap:8px}
.ring-label{font-size:12px;color:var(--text-muted)}
.ring-val{font-size:13px;font-weight:500;color:var(--green)}
svg.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(57,255,110,0.1);stroke-width:3}
.ring-fill{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 0.5s ease;filter:drop-shadow(0 0 4px var(--green))}
.task-list{padding:10px 20px 6px}
.task-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.task-item:last-child{border-bottom:none}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-muted)}
.cb{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(57,255,110,0.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;cursor:pointer}
.cb.checked{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(57,255,110,0.45)}
.cb.checked::after{content:"";width:6px;height:3.5px;border-left:1.5px solid #0d1117;border-bottom:1.5px solid #0d1117;transform:rotate(-45deg) translate(0.5px,-0.5px)}
.task-text{font-size:15px;color:#d0d3d8;line-height:1.5;flex:1;cursor:pointer}
.del-btn{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;color:var(--text-muted);font-size:16px;line-height:1;border-radius:4px}
.del-btn:hover{color:#ef4444;opacity:1!important}
.task-item:hover .del-btn{opacity:0.4}
.add-row{display:flex;align-items:center;gap:10px;padding:12px 20px 16px}
.add-btn-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(57,255,110,0.25);display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(57,255,110,0.4);flex-shrink:0;line-height:1}
.add-inp{flex:1;background:transparent;border:none;font-size:15px;color:#e8eaed;font-family:sans-serif;outline:none}
.add-inp::placeholder{color:rgba(255,255,255,0.18)}

body{padding-bottom:0}
.header{padding-top:16px!important}
.si{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:18px;background:#1a2230;border:1px solid rgba(57,255,110,0.3);color:#39ff6e;font-size:11px;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity 0.3s;z-index:200}
.si.on{opacity:1}
</style>

<style>
/* ── TOP TABS ── */
.top-tabs {
  display: flex;
  gap: 0;
  background: #0d1219;
  border-bottom: 1px solid rgba(57,255,110,0.1);
  padding: 0 20px;
}
.top-tab {
  padding: 11px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: rgba(232,234,237,0.38);
  font-size: 13px;
  font-weight: 600;
  font-family: -apple-system, sans-serif;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.top-tab.active {
  color: #39ff6e;
  border-bottom-color: #39ff6e;
}

/* ── MEET ── */
#panel-meet {
  display: none;
  padding: 20px 16px;
}
#panel-meet.active { display: block; }
#panel-planner { display: block; }
#panel-planner.hidden { display: none; }

.meet-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 700px) {
  .meet-grid { grid-template-columns: 1fr; }
}

.meet-col {
  background: #131920;
  border: 1px solid rgba(57,255,110,0.1);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.meet-col-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgba(57,255,110,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.meet-col-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(232,234,237,0.65);
}

.meet-col-title.questions { color: #4da6ff; }
.meet-col-title.problems  { color: #ff4d4d; }
.meet-col-title.plans     { color: #39ff6e; }

.meet-count {
  font-size: 11px;
  font-weight: 700;
  color: rgba(232,234,237,0.3);
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 2px 8px;
}

.meet-items {
  flex: 1;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 120px;
}

.meet-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  background: #1a2230;
  border-radius: 8px;
  border: 1px solid rgba(57,255,110,0.06);
  transition: border-color .15s;
  group: true;
}
.meet-item:hover { border-color: rgba(57,255,110,0.2); }

.meet-cb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 1px solid rgba(57,255,110,0.3);
  background: #131920;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  position: relative;
  transition: background .15s;
}
.meet-cb:checked {
  background: #39ff6e;
  border-color: #39ff6e;
}
.meet-cb:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: 2px solid #000;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}

.meet-item-text {
  flex: 1;
  font-size: 13px;
  color: #e8eaed;
  line-height: 1.4;
  word-break: break-word;
}
.meet-item-text.done {
  text-decoration: line-through;
  color: rgba(232,234,237,0.35);
}

.meet-del {
  background: none;
  border: none;
  color: rgba(232,234,237,0.25);
  font-size: 16px;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  flex-shrink: 0;
  transition: color .15s;
}
.meet-del:hover { color: #ff4d4d; }

.meet-add-wrap {
  padding: 10px 12px 12px;
  border-top: 1px solid rgba(57,255,110,0.06);
}

.meet-add-input {
  width: 100%;
  background: #0d1219;
  border: 1px solid rgba(57,255,110,0.12);
  border-radius: 7px;
  color: #e8eaed;
  font-family: -apple-system, sans-serif;
  font-size: 13px;
  padding: 8px 10px;
  transition: border-color .15s;
}
.meet-add-input:focus {
  outline: none;
  border-color: rgba(57,255,110,0.35);
}
.meet-add-input::placeholder { color: rgba(232,234,237,0.25); }
</style>
</head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBbFd4OpgwvD4jJn2HuIgaPyMJRy4fqbw0",
  authDomain:"apex-report-3b9af.firebaseapp.com",
  projectId:"apex-report-3b9af",
  appId:"1:168969856617:web:5bef7b325311ba80a9a4f8"
});
const db=getFirestore(app);
const DOC_KEY='planner-data';
const CIRC=81.7;

const defaults={
  fb:{tasks:[{text:'Проверить кампании',done:false},{text:'Обновить креативы',done:false},{text:'Проверить CTR',done:false}]},
  tt:{tasks:[{text:'Просмотреть статистику',done:false},{text:'Загрузить новые видео',done:false},{text:'Ответить на комменты',done:false}]}
};

let data=JSON.parse(JSON.stringify(defaults));
let saveT=null;
let ignoreSnapshot=false;

// Save to Firebase
function save(){
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      ignoreSnapshot=true;
      await setDoc(doc(db,'planner',DOC_KEY),JSON.parse(JSON.stringify(data)));
      const si=document.getElementById('si');si.classList.add('on');setTimeout(()=>si.classList.remove('on'),2000);
      setTimeout(()=>ignoreSnapshot=false,1000);
    }catch(e){console.error('save err',e);}
  },600);
}

function renderTasks(p){
  const el=document.getElementById('tasks-'+p);
  if(!el)return;
  el.innerHTML=(data[p].tasks||[]).map((t,i)=>`<div class="task-item ${t.done?'done':''}"><div class="cb ${t.done?'checked':''}" onclick="toggle('${p}',${i})"></div><div class="task-text" onclick="toggle('${p}',${i})">${t.text}</div><div class="del-btn" onclick="delTask('${p}',${i})">×</div></div>`).join('');
  updateRing(p);
}

function toggle(p,i){data[p].tasks[i].done=!data[p].tasks[i].done;save();renderTasks(p);}

function delTask(p,i){data[p].tasks.splice(i,1);save();renderTasks(p);}

function updateRing(p){
  const tasks=data[p].tasks||[];
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;
  const r=document.getElementById('ring-'+p);
  const rv=document.getElementById('rval-'+p);
  const rl=document.getElementById('rlabel-'+p);
  if(r)r.style.strokeDashoffset=CIRC-(CIRC*pct/100);
  if(rv)rv.textContent=pct+'%';
  if(rl)rl.textContent=done+'/'+total;
}

window.toggle=toggle;
window.delTask=delTask;
window.addTask=function(p,inp,e){
  if(e.key!=='Enter')return;
  const v=inp.value.trim();if(!v)return;
  if(!data[p].tasks)data[p].tasks=[];
  data[p].tasks.push({text:v,done:false});
  save();inp.value='';renderTasks(p);
};

function clock(){
  const n=new Date();
  const pad=x=>String(x).padStart(2,'0');
  const ct=document.getElementById('clk-time');
  const cd=document.getElementById('clk-date');
  if(ct)ct.textContent=pad(n.getHours())+':'+pad(n.getMinutes());
  const days=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  if(cd)cd.textContent=days[n.getDay()]+' · '+n.getDate()+' '+months[n.getMonth()]+' '+n.getFullYear();
}

// Load from Firebase then subscribe to realtime updates
async function init(){
  try{
    const snap=await getDoc(doc(db,'planner',DOC_KEY));
    if(snap.exists()){
      const d=snap.data();
      if(d.fb)data.fb=d.fb;
      if(d.tt)data.tt=d.tt;
    }
  }catch(e){console.error('load err',e);}
  renderTasks('fb');renderTasks('tt');

  // Realtime sync - when another device saves, update this one
  onSnapshot(doc(db,'planner',DOC_KEY),(snap)=>{
    if(ignoreSnapshot)return;
    if(snap.exists()){
      const d=snap.data();
      if(d.fb)data.fb=d.fb;
      if(d.tt)data.tt=d.tt;
      renderTasks('fb');renderTasks('tt');
    }
  });
}

clock();setInterval(clock,30000);
init();


// ── MEET ──
const meetState = { questions: [], problems: [], plans: [] };
let meetSaveTimer = null;

async function meetLoad() {
  try {
    const snap = await getDoc(doc(db, 'planner', 'meet-data'));
    if (snap.exists()) {
      const d = snap.data();
      meetState.questions = d.questions || [];
      meetState.problems  = d.problems  || [];
      meetState.plans     = d.plans     || [];
    }
  } catch(e) { console.warn('meet load err', e); }
  meetRenderAll();
}

async function meetSave() {
  try {
    await setDoc(doc(db, 'planner', 'meet-data'), {
      questions: meetState.questions,
      problems:  meetState.problems,
      plans:     meetState.plans
    });
    const si=document.getElementById('si'); if(si){si.classList.add('on');setTimeout(()=>si.classList.remove('on'),2000);}
  } catch(e) { console.warn('meet save err', e); }
}

function meetScheduleSave() {
  if (meetSaveTimer) clearTimeout(meetSaveTimer);
  meetSaveTimer = setTimeout(meetSave, 800);
}

function meetRenderAll() {
  ['questions','problems','plans'].forEach(meetRender);
}

function meetRender(col) {
  const list = meetState[col];
  const el = document.getElementById('items-' + col);
  const cnt = document.getElementById('cnt-' + col);
  if (!el) return;
  cnt.textContent = list.length;
  el.innerHTML = '';
  list.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'meet-item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'meet-cb';
    cb.checked = !!item.done;
    cb.addEventListener('change', () => {
      item.done = cb.checked;
      txt.className = 'meet-item-text' + (item.done ? ' done' : '');
      meetScheduleSave();
    });

    const txt = document.createElement('span');
    txt.className = 'meet-item-text' + (item.done ? ' done' : '');
    txt.textContent = item.text;

    const del = document.createElement('button');
    del.className = 'meet-del';
    del.textContent = '×';
    del.addEventListener('click', () => {
      meetState[col].splice(i, 1);
      meetRender(col);
      meetScheduleSave();
    });

    div.appendChild(cb);
    div.appendChild(txt);
    div.appendChild(del);
    el.appendChild(div);
  });
}

window.meetAdd = function(col) {
  const inp = document.getElementById('inp-' + col);
  const val = inp.value.trim();
  if (!val) return;
  meetState[col].push({ text: val, done: false });
  inp.value = '';
  meetRender(col);
  meetScheduleSave();
};

window.switchTopTab = function(tab) {
  document.querySelectorAll('.top-tab').forEach((b,i) =>
    b.classList.toggle('active', (i===0 && tab==='planner') || (i===1 && tab==='meet'))
  );
  document.getElementById('panel-planner').classList.toggle('hidden', tab !== 'planner');
  document.getElementById('panel-meet').classList.toggle('active', tab === 'meet');
};

meetLoad();
</script>
</div>
</body>
