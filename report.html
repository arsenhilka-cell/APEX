<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#39ff6e;--gdim:rgba(57,255,110,0.08);
  --s1:#131920;--s2:#1a2230;--s3:#0d1219;
  --b:rgba(57,255,110,0.1);--bh:rgba(57,255,110,0.28);
  --tx:#e8eaed;--tm:rgba(232,234,237,0.38);--t2:rgba(232,234,237,0.65);
  --red:#ff4d4d;
}
body{background:#0a0f14;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;padding-top:max(14px, env(safe-area-inset-top));border-bottom:1px solid var(--b);background:#0a0f14;position:sticky;top:0;z-index:100}
.la{display:flex;align-items:center;gap:10px}
.lw{width:32px;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--bh)}
.lw img{width:100%;height:100%;object-fit:cover}
.brand{font-size:15px;font-weight:600;color:#fff}.brand span{color:var(--green)}
.hr{display:flex;align-items:center;gap:10px}
.clk{font-size:13px;color:var(--tm)}
.ms{display:flex;gap:3px;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:3px}
.mb{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:500;color:var(--tm);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.mb.on{background:var(--gdim);color:var(--green);border:1px solid rgba(57,255,110,0.3)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;border-bottom:1px solid var(--b)}
.tc{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:13px 15px}
.tl{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.tv{font-size:21px;font-weight:700;color:#fff}
.tv.g{color:var(--green)}.tv.r{color:var(--red)}
.ts{font-size:10px;color:var(--tm);margin-top:2px}
.pls{padding:14px 20px;display:flex;flex-direction:column;gap:16px}
.pb{background:var(--s1);border:1px solid var(--b);border-radius:16px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--b);background:var(--s2);flex-wrap:wrap;gap:8px}
.pt{display:flex;align-items:center;gap:9px}
.pi{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi{background:linear-gradient(135deg,#1877f2,#0c5fd4)}
.ti{background:#111;border:1px solid #333}
.pn{font-size:14px;font-weight:600;color:#fff}
.pss{display:flex;gap:14px}
.psi{text-align:right}
.psl{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:0.06em}
.psv{font-size:13px;font-weight:600;color:#fff}
.psv.g{color:var(--green)}.psv.r{color:var(--red)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:800px}
th{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:0.05em;padding:7px 6px;border-bottom:1px solid var(--b);border-right:1px solid rgba(255,255,255,0.04);background:var(--s3);text-align:center;white-space:nowrap}
th.oc{text-align:left;min-width:115px;position:sticky;left:0;z-index:5;background:var(--s3)}
td{font-size:12px;padding:5px 5px;border-bottom:1px solid rgba(255,255,255,0.03);border-right:1px solid rgba(255,255,255,0.03);text-align:center;color:var(--t2)}
td.ofc{text-align:left;position:sticky;left:0;z-index:4;background:var(--s1)}
td input{background:transparent;border:none;color:inherit;font-size:12px;font-family:inherit;width:100%;text-align:center;outline:none;padding:0;min-width:32px}
td input:focus{background:rgba(57,255,110,0.06);border-radius:3px}
td.ofc input{text-align:left;color:var(--tx)}
.sc input{color:#7eb8f7}.rc input{color:#a8e6a3}
.ra td{background:rgba(57,255,110,0.05)}
.ra td.ofc{color:var(--green);font-size:11px;font-weight:600;background:rgba(57,255,110,0.05)}
.rt td{background:var(--s2);font-weight:600}
.rt td.ofc{font-size:11px;color:var(--tm);background:var(--s2)}
.rp td.ofc{font-size:11px;color:var(--tm)}
.p1g{background:rgba(57,255,110,0.12)!important;color:#7deb97!important}
.p2g{background:rgba(57,255,110,0.28)!important;color:#39ff6e!important}
.p3g{background:rgba(57,255,110,0.52)!important;color:#fff!important}
.p1r{background:rgba(255,77,77,0.12)!important;color:#ff8080!important}
.p2r{background:rgba(255,77,77,0.28)!important;color:#ff4d4d!important}
.p3r{background:rgba(255,77,77,0.52)!important;color:#fff!important}
.dth{color:var(--green)!important;font-weight:700!important}
.si{position:fixed;bottom:18px;right:18px;background:var(--s2);border:1px solid rgba(57,255,110,0.3);color:var(--green);font-size:11px;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity 0.3s;z-index:200}
.si.on{opacity:1}
.ld{display:flex;align-items:center;justify-content:center;height:160px;color:var(--tm);font-size:13px;gap:8px}
.sp{width:16px;height:16px;border:2px solid var(--b);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .totals{grid-template-columns:repeat(2,1fr);padding:10px 12px;gap:8px}
  .tv{font-size:17px}.clk{display:none}
  .pls{padding:10px 12px}.ph{padding:10px 12px}
  .mb{padding:4px 8px;font-size:11px}
}
</style>
</head>
<body>

function ensure(k,o){
  const d=mdays(o);
  if(!D[k])D[k]={fb:emptyP(d),tt:emptyP(d)};
  ['fb','tt'].forEach(p=>{
    if(!D[k][p])D[k][p]=emptyP(d);
    const pd=D[k][p];
    if(!pd.offers)pd.offers={};
    if(!pd.spend_a)pd.spend_a={};
    if(!pd.rev_a)pd.rev_a={};
    if(!pd.rev)pd.rev={};
    for(let i=0;i<8;i++)if(!pd.offers['o'+i])pd.offers['o'+i]='Оффер '+(i+1);
    for(let di=0;di<d;di++){
      if(pd.spend_a['d'+di]===undefined)pd.spend_a['d'+di]='';
      if(pd.rev_a['d'+di]===undefined)pd.rev_a['d'+di]='';
      for(let i=0;i<8;i++)if(pd.rev['r'+i+'d'+di]===undefined)pd.rev['r'+i+'d'+di]='';
    }
  });
}

async function loadM(o){
  const k=mkey(o);
  try{const s=await getDoc(doc(db,'reports',k));if(s.exists())D[k]=s.data();}catch(e){console.error('load err',e);}
  ensure(k,o);
}

function dayCalc(pd,di){
  const sp=nv(pd.spend_a['d'+di]);
  let rv=nv(pd.rev_a['d'+di]);
  for(let i=0;i<8;i++)rv+=nv(pd.rev['r'+i+'d'+di]);
  return{sp,rv,profit:rv-sp};
}

function platformCalc(pd,d){
  let sp=0,rv=0;
  for(let di=0;di<d;di++){const dc=dayCalc(pd,di);sp+=dc.sp;rv+=dc.rv;}
  return{sp,rv,profit:rv-sp};
}

function refreshAll(){
  const k=mkey(off),d=mdays(off);
  ensure(k,off);
  ['fb','tt'].forEach(pkey=>{
    const pd=D[k][pkey];
    const{sp,rv,profit}=platformCalc(pd,d);
    const roi=sp>0?profit/sp*100:0;
    const h=document.getElementById('ph-'+pkey);
    if(!h)return;
    h.querySelector('.v-sp').textContent='$'+sp.toFixed(0);
    h.querySelector('.v-rv').textContent='$'+rv.toFixed(0);
    const vp=h.querySelector('.v-pf');
    vp.textContent=(profit>=0?'+':'')+profit.toFixed(0);
    vp.className='psv '+(profit>=0?'g':'r')+' v-pf';
    const vr=h.querySelector('.v-roi');
    vr.textContent=roi.toFixed(1)+'%';
    vr.className='psv '+(roi>=0?'g':'r')+' v-roi';
    for(let di=0;di<d;di++){
      const dc=dayCalc(pd,di);
      const its=document.getElementById('it-'+pkey+'-'+di+'-s');
      const itr=document.getElementById('it-'+pkey+'-'+di+'-r');
      const pr=document.getElementById('pr-'+pkey+'-'+di);
      if(its)its.textContent=dc.sp||'';
      if(itr)itr.textContent=dc.rv||'';
      if(pr){
        const has=dc.sp||dc.rv;
        pr.textContent=has?(dc.profit>=0?'+':'')+dc.profit.toFixed(0):'';
        pr.className=has?pclass(dc.profit):'';
      }
    }
  });
  const k2=mkey(off),d2=mdays(off);
  const fb=platformCalc(D[k2].fb,d2),tt=platformCalc(D[k2].tt,d2);
  const tsp=fb.sp+tt.sp,trv=fb.rv+tt.rv;
  const cost=tsp*1.03,net=trv-cost,roi=cost>0?net/cost*100:0;
  document.getElementById('tc').textContent='$'+tsp.toFixed(0)+' (+3%: $'+cost.toFixed(0)+')';
  document.getElementById('tr').textContent='$'+trv.toFixed(0);
  const tp=document.getElementById('tp');tp.textContent=(net>=0?'+':'')+net.toFixed(0);tp.className='tv '+(net>=0?'g':'r');
  const tr=document.getElementById('troi');tr.textContent=roi.toFixed(1)+'%';tr.className='tv '+(roi>=0?'g':'r');
}

function save(k){
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      await setDoc(doc(db,'reports',k),D[k]);
      const si=document.getElementById('si');si.classList.add('on');setTimeout(()=>si.classList.remove('on'),2000);
    }catch(e){console.error('SAVE ERROR',e);}
  },1000);
}

window.W={
  offer(p,k,i,v){D[k][p].offers['o'+i]=v;save(k);},
  rev(p,k,i,di,v){D[k][p].rev['r'+i+'d'+di]=v;refreshAll();save(k);},
  sp(p,k,di,v){D[k][p].spend_a['d'+di]=v;refreshAll();save(k);},
  rv(p,k,di,v){D[k][p].rev_a['d'+di]=v;refreshAll();save(k);}
};

function buildTable(pkey,pname){
  const k=mkey(off),d=mdays(off),pd=D[k][pkey];
  const tod=now.getDate(),isc=off===0;
  const{sp,rv,profit}=platformCalc(pd,d);
  const roi=sp>0?profit/sp*100:0;
  const fbsvg='<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>';
  const ttsvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.75a8.19 8.19 0 004.79 1.53V6.82a4.85 4.85 0 01-1.02-.13z"/></svg>';

  let h=`<div class="pb">
  <div class="ph" id="ph-${pkey}">
    <div class="pt"><div class="pi ${pkey==='fb'?'fi':'ti'}">${pkey==='fb'?fbsvg:ttsvg}</div><span class="pn">${pname}</span></div>
    <div class="pss">
      <div class="psi"><div class="psl">Spend</div><div class="psv v-sp">$${sp.toFixed(0)}</div></div>
      <div class="psi"><div class="psl">Revenue</div><div class="psv g v-rv">$${rv.toFixed(0)}</div></div>
      <div class="psi"><div class="psl">Profit</div><div class="psv ${profit>=0?'g':'r'} v-pf">${profit>=0?'+':''}${profit.toFixed(0)}</div></div>
      <div class="psi"><div class="psl">ROI</div><div class="psv ${roi>=0?'g':'r'} v-roi">${roi.toFixed(1)}%</div></div>
    </div>
  </div>
  <div class="tw"><table>
  <thead><tr><th class="oc">Оффер</th>`;
  for(let i=1;i<=d;i++)h+=`<th colspan="2"${isc&&i===tod?' class="dth"':''}>${i}</th>`;
  h+=`</tr><tr><th class="oc" style="background:var(--s3)"></th>`;
  for(let i=0;i<d;i++)h+=`<th>Sp</th><th>Rev</th>`;
  h+=`</tr></thead><tbody>`;

  for(let i=0;i<8;i++){
    const name=(pd.offers['o'+i]||'').replace(/"/g,'&quot;');
    h+=`<tr><td class="ofc"><input value="${name}" placeholder="Оффер ${i+1}" onchange="W.offer('${pkey}','${k}',${i},this.value)"/></td>`;
    for(let di=0;di<d;di++){
      h+=`<td class="sc"><input value="" readonly tabindex="-1" style="color:var(--tm)"/></td>`;
      const rv=pd.rev['r'+i+'d'+di]||'';
      h+=`<td class="rc"><input value="${rv}" oninput="W.rev('${pkey}','${k}',${i},${di},this.value)"/></td>`;
    }
    h+=`</tr>`;
  }

  h+=`<tr class="ra"><td class="ofc">УЖЕ ЕСТЬ</td>`;
  for(let di=0;di<d;di++){
    h+=`<td class="sc"><input value="${pd.spend_a['d'+di]||''}" oninput="W.sp('${pkey}','${k}',${di},this.value)"/></td>`;
    h+=`<td class="rc"><input value="${pd.rev_a['d'+di]||''}" oninput="W.rv('${pkey}','${k}',${di},this.value)"/></td>`;
  }
  h+=`</tr><tr class="rt"><td class="ofc">ИТОГО</td>`;
  for(let di=0;di<d;di++){
    const dc=dayCalc(pd,di);
    h+=`<td style="color:#7eb8f7;font-weight:600" id="it-${pkey}-${di}-s">${dc.sp||''}</td>`;
    h+=`<td style="color:#a8e6a3;font-weight:600" id="it-${pkey}-${di}-r">${dc.rv||''}</td>`;
  }
  h+=`</tr><tr class="rp"><td class="ofc">ПРОФИТ</td>`;
  for(let di=0;di<d;di++){
    const dc=dayCalc(pd,di);
    const has=dc.sp||dc.rv;
    h+=`<td colspan="2" id="pr-${pkey}-${di}" class="${has?pclass(dc.profit):''}" style="font-weight:700">${has?(dc.profit>=0?'+':'')+dc.profit.toFixed(0):''}</td>`;
  }
  h+=`</tr></tbody></table></div></div>`;
  return h;
}

window.switchM=function(o){
  off=o;
  document.getElementById('bp').classList.toggle('on',o===-1);
  document.getElementById('bc').classList.toggle('on',o===0);
  document.getElementById('pls').innerHTML=buildTable('fb','Facebook')+buildTable('tt','TikTok');
  refreshAll();
};

function clk(){const n=new Date(),p=x=>String(x).padStart(2,'0');document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes());}
clk();setInterval(clk,30000);
document.getElementById('bp').textContent=mlbl(-1);
document.getElementById('bc').textContent=mlbl(0);

async function init(){
  await Promise.all([loadM(0),loadM(-1)]);
  document.getElementById('pls').innerHTML=buildTable('fb','Facebook')+buildTable('tt','TikTok');
  refreshAll();
}
init();
</script>
</body>
</html>
